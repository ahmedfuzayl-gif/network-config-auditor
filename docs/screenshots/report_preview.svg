<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="dashShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="10" y="10" width="900" height="600" rx="10" fill="url(#dashGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#dashShadow)" />
  <path d="M 10 20 A 10 10 0 0 1 20 10 L 900 10 A 10 10 0 0 1 910 20 L 910 44 L 10 44 Z" fill="#21262d" />
  <circle cx="32" cy="27" r="6" fill="#ff5f56" />
  <circle cx="52" cy="27" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="27" r="6" fill="#27c93f" />

  <!-- Address Bar -->
  <rect x="100" y="18" width="720" height="20" rx="5" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="115" y="32" font-family="'SF Mono', Consolas, sans-serif" font-size="11" fill="#8b949e">file:///reports/audit_report.html - NTConfReviewer Security Dashboard</text>

  <!-- Dashboard Header -->
  <text x="35" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">Enterprise Configuration Security Audit</text>
  <text x="35" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#8b949e">Offline Multi-Vendor Static Analysis • CIS Controls v8 • DISA STIG • NIST SP 800-53 • PCI-DSS v4.0</text>

  <!-- Metric Card 1: Score -->
  <rect x="35" y="120" width="195" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
  <text x="55" y="145" font-family="sans-serif" font-size="11" fill="#8b949e" font-weight="bold">SECURITY POSTURE SCORE</text>
  <text x="55" y="185" font-family="sans-serif" font-size="32" fill="#ffa657" font-weight="bold">68 <tspan font-size="16" fill="#8b949e">/ 100</tspan></text>
  <text x="55" y="205" font-family="sans-serif" font-size="11" fill="#ffa657">Action Recommended (High)</text>

  <!-- Metric Card 2: Device -->
  <rect x="245" y="120" width="195" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
  <text x="265" y="145" font-family="sans-serif" font-size="11" fill="#8b949e" font-weight="bold">TARGET ASSET</text>
  <text x="265" y="175" font-family="sans-serif" font-size="18" fill="#58a6ff" font-weight="bold">Cisco ASA 5525-X</text>
  <text x="265" y="200" font-family="sans-serif" font-size="11" fill="#8b949e">1,428 parsed CLI lines</text>

  <!-- Metric Card 3: Total Findings -->
  <rect x="455" y="120" width="195" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
  <text x="475" y="145" font-family="sans-serif" font-size="11" fill="#8b949e" font-weight="bold">TOTAL FINDINGS</text>
  <text x="475" y="185" font-family="sans-serif" font-size="32" fill="#f0f6fc" font-weight="bold">6</text>
  <text x="510" y="185" font-family="sans-serif" font-size="12" fill="#8b949e">issues detected</text>
  <text x="475" y="205" font-family="sans-serif" font-size="11" fill="#ff7b72">3 Critical / High</text>

  <!-- Metric Card 4: Compliance -->
  <rect x="665" y="120" width="215" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
  <text x="685" y="145" font-family="sans-serif" font-size="11" fill="#8b949e" font-weight="bold">COMPLIANCE COMPATIBILITY</text>
  <text x="685" y="175" font-family="sans-serif" font-size="13" fill="#7ee787" font-weight="bold">✓ CIS Benchmarks</text>
  <text x="685" y="195" font-family="sans-serif" font-size="13" fill="#7ee787" font-weight="bold">✓ DoD DISA STIGs</text>

  <!-- Filter Buttons -->
  <g font-family="sans-serif" font-size="11" font-weight="bold">
    <rect x="35" y="240" width="70" height="28" rx="14" fill="#388bfd" />
    <text x="50" y="258" fill="#ffffff">All (6)</text>

    <rect x="115" y="240" width="95" height="28" rx="14" fill="#21262d" stroke="#ff7b72" stroke-width="1" />
    <text x="125" y="258" fill="#ff7b72">Critical (1)</text>

    <rect x="220" y="240" width="85" height="28" rx="14" fill="#21262d" stroke="#ffa657" stroke-width="1" />
    <text x="232" y="258" fill="#ffa657">High (2)</text>

    <rect x="315" y="240" width="95" height="28" rx="14" fill="#21262d" stroke="#d29922" stroke-width="1" />
    <text x="327" y="258" fill="#d29922">Medium (2)</text>

    <rect x="420" y="240" width="80" height="28" rx="14" fill="#21262d" stroke="#58a6ff" stroke-width="1" />
    <text x="435" y="258" fill="#58a6ff">Low (1)</text>
  </g>

  <!-- Findings Table -->
  <g font-family="sans-serif" font-size="11.5">
    <!-- Table Header -->
    <rect x="35" y="285" width="845" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="48" y="306" font-weight="bold" fill="#8b949e">SEVERITY</text>
    <text x="140" y="306" font-weight="bold" fill="#8b949e">SECURITY DOMAIN</text>
    <text x="280" y="306" font-weight="bold" fill="#8b949e">FINDING TITLE &amp; DESCRIPTION</text>
    <text x="680" y="306" font-weight="bold" fill="#8b949e">COMPLIANCE</text>

    <!-- Row 1: Critical -->
    <rect x="35" y="317" width="845" height="52" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="48" y="330" width="65" height="22" rx="4" fill="#ff7b72" />
    <text x="54" y="345" fill="#0d1117" font-weight="bold" font-size="10.5">CRITICAL</text>
    <text x="140" y="347" fill="#c9d1d9">Administrative Access</text>
    <text x="280" y="340" fill="#f0f6fc" font-weight="bold">Telnet daemon active on management plane</text>
    <text x="280" y="358" fill="#8b949e" font-size="10.5">Unencrypted remote CLI administration enabled on internal segment</text>
    <text x="680" y="347" fill="#58a6ff">CIS 1.1.2 • DISA STIG</text>

    <!-- Row 2: High -->
    <rect x="35" y="369" width="845" height="52" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="48" y="382" width="50" height="22" rx="4" fill="#ffa657" />
    <text x="58" y="397" fill="#0d1117" font-weight="bold" font-size="10.5">HIGH</text>
    <text x="140" y="399" fill="#c9d1d9">SNMP Security</text>
    <text x="280" y="392" fill="#f0f6fc" font-weight="bold">SNMP community 'public' configured with WRITE privilege</text>
    <text x="280" y="410" fill="#8b949e" font-size="10.5">Default community string allows arbitrary device reconfiguration</text>
    <text x="680" y="399" fill="#58a6ff">CIS 2.1 • PCI-DSS 2.1</text>

    <!-- Row 3: High -->
    <rect x="35" y="421" width="845" height="52" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="48" y="434" width="50" height="22" rx="4" fill="#ffa657" />
    <text x="58" y="449" fill="#0d1117" font-weight="bold" font-size="10.5">HIGH</text>
    <text x="140" y="451" fill="#c9d1d9">Cryptography &amp; AAA</text>
    <text x="280" y="444" fill="#f0f6fc" font-weight="bold">Reversible Cisco Type 7 password hash detected</text>
    <text x="280" y="462" fill="#8b949e" font-size="10.5">Hash auto-decoded to plaintext during review (evidence auto-redacted)</text>
    <text x="680" y="451" fill="#58a6ff">NIST AC-3 • CIS 1.2</text>

    <!-- Row 4: Medium -->
    <rect x="35" y="473" width="845" height="52" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="48" y="486" width="62" height="22" rx="4" fill="#d29922" />
    <text x="54" y="501" fill="#0d1117" font-weight="bold" font-size="10.5">MEDIUM</text>
    <text x="140" y="503" fill="#c9d1d9">Firewall Policy</text>
    <text x="280" y="496" fill="#f0f6fc" font-weight="bold">Overly permissive Any-Any firewall rule</text>
    <text x="280" y="514" fill="#8b949e" font-size="10.5">Access-list rule allows all source and destination ports</text>
    <text x="680" y="503" fill="#58a6ff">PCI-DSS 1.3 • STIG</text>

    <!-- Row 5: Medium -->
    <rect x="35" y="525" width="845" height="52" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="48" y="538" width="62" height="22" rx="4" fill="#d29922" />
    <text x="54" y="553" fill="#0d1117" font-weight="bold" font-size="10.5">MEDIUM</text>
    <text x="140" y="555" fill="#c9d1d9">Time Synchronization</text>
    <text x="280" y="548" fill="#f0f6fc" font-weight="bold">Missing NTP server cryptographic authentication</text>
    <text x="280" y="566" fill="#8b949e" font-size="10.5">NTP packets vulnerable to spoofing or man-in-the-middle tampering</text>
    <text x="680" y="555" fill="#58a6ff">CIS 3.2 • NIST AU-8</text>
  </g>
</svg>