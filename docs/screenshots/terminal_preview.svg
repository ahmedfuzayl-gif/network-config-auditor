      <text x="30" y="144">.                              /  \                               .</text>
      <text x="30" y="158">.                             / /\ \                              .</text>
      <text x="30" y="172">.                            / /  \ \                             .</text>
      <text x="30" y="186">.                           / / /\ \ \                            .</text>
      <text x="30" y="200">.                          | | |  | | |                           .</text>
      <text x="30" y="214">.                          | | |  | | |                           .</text>
      <text x="30" y="228">.                           \ \ \/ / /                            .</text>
      <text x="30" y="242">.                            \ \  / /                             .</text>
      <text x="30" y="256">.                             \ \/ /                              .</text>
      <text x="30" y="270">.                              \  /                               .</text>
      <text x="30" y="284">.                               \/                                .</text>
      <text x="30" y="298">.                                                                 .</text>
      <text x="30" y="312">.  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .</text>
    </g>

    <!-- Execution Stats -->
    <text x="30" y="340" fill="#58a6ff">[*] Detected Asset : <tspan fill="#ffffff" font-weight="bold">Cisco ASA 5525-X</tspan> (Vendor: cisco-asa) - 1,428 lines</text>
    <text x="30" y="358" fill="#58a6ff">[*] Engine Rules   : 104 static rule-checks evaluated across 11 security domains</text>
    <text x="30" y="376" fill="#58a6ff">[*] Cryptography   : Reversible hash auto-decoding active (Type 7 / Juniper $9$)</text>

    <!-- Findings -->
    <text x="30" y="410" fill="#ff7b72" font-weight="bold">[CRITICAL]</text>
    <text x="120" y="410">Insecure Management: Telnet daemon active on management segment (CIS 1.1.2)</text>

    <text x="30" y="432" fill="#ffa657" font-weight="bold">[HIGH]</text>
    <text x="120" y="432">SNMP Community 'public' configured with WRITE privilege (STIG AS00-00018)</text>

    <text x="30" y="454" fill="#ffa657" font-weight="bold">[HIGH]</text>
    <text x="120" y="454">Reversible Cisco Type 7 password hash auto-decoded [PlainText Verified]</text>

    <text x="30" y="476" fill="#d29922" font-weight="bold">[MEDIUM]</text>
    <text x="120" y="476">Firewall ACL Permissive Rule: 'any-any' permit found on interface OUTSIDE</text>

    <text x="30" y="498" fill="#d29922" font-weight="bold">[MEDIUM]</text>
    <text x="120" y="498">NTP Server Authentication Missing: Time synchronization unauthenticated</text>

    <text x="30" y="520" fill="#58a6ff" font-weight="bold">[LOW]</text>
    <text x="120" y="520">Missing Authorized Access Warning Banner: MOTD banner is empty</text>

    <!-- Footer summary -->
    <line x1="30" y1="545" x2="880" y2="545" stroke="#30363d" stroke-width="1" />
    <text x="30" y="570" fill="#7ee787" font-weight="bold">[+] Review Complete:</text>
    <text x="200" y="570">1 Critical | 2 High | 2 Medium | 1 Low | 0 Info</text>
    <text x="30" y="592" fill="#8b949e">[+] Exported standalone reports: <tspan fill="#58a6ff">audit_report.html</tspan>, <tspan fill="#58a6ff">audit_report.csv</tspan>, <tspan fill="#58a6ff">audit_report.json</tspan></text>
