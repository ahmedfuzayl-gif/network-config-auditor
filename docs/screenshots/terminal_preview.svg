<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect x="10" y="10" width="900" height="600" rx="10" fill="url(#terminalGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Window Bar -->
  <path d="M 10 20 A 10 10 0 0 1 20 10 L 900 10 A 10 10 0 0 1 910 20 L 910 44 L 10 44 Z" fill="#21262d" />
  <circle cx="32" cy="27" r="6" fill="#ff5f56" />
  <circle cx="52" cy="27" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="27" r="6" fill="#27c93f" />
  <text x="460" y="32" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="12" fill="#8b949e" text-anchor="middle">secops@audit-node: ~/network-audit - NTConfReviewer</text>

  <!-- Content -->
  <g font-family="'SF Mono', Consolas, Monaco, 'Courier New', monospace" font-size="12.5" fill="#c9d1d9">
    <!-- Command Prompt -->
    <text x="30" y="75" fill="#58a6ff">$ <tspan fill="#7ee787">python NTConfReviewer.py</tspan> <tspan fill="#ffa657">firewall-edge.conf</tspan> <tspan fill="#8b949e">-o audit_report</tspan></text>

    <!-- Minimalist Hex Banner -->
